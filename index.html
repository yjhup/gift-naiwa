<body class="landing">
  <div class="sky" aria-hidden="true"></div>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <defs>
        <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
          <stop stop-color="#1b2b5c" />
          <stop offset="1" stop-color="#0a1128" />
        </linearGradient>
        <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">

      <path fill="url(#hillBack)" d="M0 214C150 156 268 246 452 198 636 150 756 234 940 194 1124 154 1284 224 1440 184V320H0Z" />

  <main class="page">

      <div class="gift-wrap" aria-hidden="true">
        <span class="gift-glow"></span>
        <svg class="gift" viewBox="0 0 120 120" fill="none">
          <defs>
            <linearGradient id="boxBody" x1="26" y1="55" x2="94" y2="104" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ff8a5c" />
              <stop offset="1" stop-color="#ff416c" />
            </linearGradient>
            <linearGradient id="boxLid" x1="20" y1="42" x2="100" y2="58" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffbe7a" />
              <stop offset="1" stop-color="#ff6b6b" />
            </linearGradient>
            <linearGradient id="ribbon" x1="56" y1="42" x2="64" y2="104" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fff0b8" />
              <stop offset="1" stop-color="#ffc247" />
            </linearGradient>
          </defs>
          <rect x="26" y="55" width="68" height="48" rx="8" fill="url(#boxBody)" />
          <rect x="55.5" y="55" width="9" height="48" fill="url(#ribbon)" opacity=".95" />
          <rect x="20" y="42" width="80" height="16" rx="6" fill="url(#boxLid)" />
          <rect x="55.5" y="42" width="9" height="16" fill="url(#ribbon)" />
          <path d="M60 43c-9-15-30-13-25 0 3 9 19 8 25 4Z" fill="url(#ribbon)" />
          <path d="M60 43c9-15 30-13 25 0-3 9-19 8-25 4Z" fill="url(#ribbon)" />

          <path d="M33 63c8-4 17-6 25-6" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>

      <p class="eyebrow">立冬快乐</p>
      <h1>有一份冬天的礼物<br /><em>送给你</em></h1>
      <p class="question">是否要收下？</p>

      <div class="actions">
        <a class="btn btn-refuse" id="refuseBtn" href="play.html">残忍拒绝</a>
        <a class="btn btn-accept" href="play.html">收下</a>
      </div>

      <p class="footnote">今日立冬 · 宜收礼物</p>
    </section>
  </main>

  <script src="assets/snow.js" defer></script>
  <script src="assets/refuse.js" defer></script>

  <!-- 拒绝无效小剧场 -->
  <div class="refuse-scene" id="refuseScene" aria-hidden="true">
    <div class="refuse-backdrop"></div>
    <div class="refuse-panel" role="dialog" aria-modal="true" aria-labelledby="refuseTitle">
      <div class="refuse-icon" aria-hidden="true">🎁</div>
      <p class="refuse-title" id="refuseTitle">拒绝？不存在的</p>
      <p class="refuse-line" id="refuseLine"></p>
      <div class="refuse-actions">
        <button class="refuse-go" id="refuseGo" type="button" disabled>
